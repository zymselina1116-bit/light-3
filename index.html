<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Refraction Experience</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main canvas for rendering the light refraction scene -->
    <canvas id="refractionCanvas"></canvas>

    <!-- UI overlay for instructions -->
    <div class="ui-overlay">
        <div class="instructions">
            <p>Drag the light bar to change beam angle</p>
            <p class="hint">Watch the light refract through glass</p>
        </div>
        <div class="angle-display">
            <span id="angleValue">0°</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
